name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: powershell
        run: .\build_windows_installer.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WeChatLocalNotifierSetup-${{ steps.version.outputs.value }}
          path: installer/WeChatLocalNotifierSetup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error
